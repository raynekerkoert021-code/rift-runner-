
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIFT RUNNER: NEON DRIFT</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#09051b;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
h1{color:#e9a5ff;letter-spacing:3px;margin:16px 0 5px}
p{color:#c7b5e8}
.hud{
 display:flex;justify-content:space-around;
 max-width:480px;margin:15px auto;font-weight:bold;
}
canvas{
 display:block;width:94%;max-width:480px;
 height:auto;margin:10px auto;
 border:2px solid #a94cff;border-radius:15px;
 background:#100a2b;touch-action:pan-y;
}
button{
 background:linear-gradient(135deg,#a832ff,#ed49c9);
 color:white;border:0;border-radius:12px;
 padding:13px;margin:5px;font-weight:bold;
 font-size:14px;
}
#message{color:#e6baff;min-height:25px}
</style>
</head>
<body>

<h1>RIFT RUNNER</h1>
<p>NEON DRIFT · ENTER THE UNKNOWN</p>

<div class="hud">
<span>SCORE: <b id="score">0</b></span>
<span>BEST: <b id="best">0</b></span>
<span>ENERGY: <b id="energy">0</b></span>
</div>

<canvas id="game" width="480" height="650"></canvas>

<div id="message">Ready to enter the Rift?</div>

<div>
<button onclick="move(-1)">◀ LEFT</button>
<button onclick="phase()">⚡ RIFT SHIFT</button>
<button onclick="move(1)">RIGHT ▶</button>
</div>
<div>
<button onclick="jump()">JUMP</button>
<button onclick="startGame()">START / RESTART</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let lane=1;
let score=0;
let energy=0;
let best=Number(localStorage.getItem("riftBest")||0);
let objects=[];
let running=false;
let frame=0;
let phasing=0;
let jumping=0;
let speed=4;
let animation=null;

document.getElementById("best").textContent=best;

function move(direction){
 if(!running)return;
 lane=Math.max(0,Math.min(2,lane+direction));
}

function phase(){
 if(!running||energy<5||phasing>0)return;
 energy-=5;
 phasing=100;
 document.getElementById("message").textContent="RIFT SHIFT ACTIVATED!";
 updateHUD();
}

function jump(){
 if(running&&jumping===0){
  jumping=100;
 }
}

function updateHUD(){
 document.getElementById("score").textContent=score;
 document.getElementById("best").textContent=best;
 document.getElementById("energy").textContent=energy;
}

function drawBackground(){
 let bg=ctx.createLinearGradient(0,0,0,650);
 bg.addColorStop(0,"#09051b");
 bg.addColorStop(1,"#28104d");
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,480,650);

 for(let i=0;i<12;i++){
  let x=i*44;
  ctx.fillStyle=i%2?"#17113a":"#211044";
  ctx.fillRect(x,100+(i%3)*35,30,550);
  for(let y=130+(i%3)*35;y<620;y+=35){
   ctx.fillStyle="#bd4cff";
   ctx.fillRect(x+8,y,5,9);
   ctx.fillStyle="#42dfff";
   ctx.fillRect(x+19,y,5,9);
  }
 }

 ctx.fillStyle="#100c28";
 ctx.beginPath();
 ctx.moveTo(115,90);
 ctx.lineTo(365,90);
 ctx.lineTo(480,650);
 ctx.lineTo(0,650);
 ctx.closePath();
 ctx.fill();
